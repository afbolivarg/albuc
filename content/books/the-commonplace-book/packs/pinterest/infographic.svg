<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500">
  <rect width="1000" height="1500" fill="#faf9f6"/>
  <rect x="40" y="40" width="920" height="1420" fill="none" stroke="#274234" stroke-width="3"/>
  <text x="80" y="140" fill="#c47a8a" font-family="Georgia, serif" font-size="20" letter-spacing="5">ALBUC  ·  2:3</text>
  <foreignObject x="80" y="180" width="840" height="280">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Georgia,serif;color:#1d1a14;font-size:44px;line-height:1.15">You don't have a reading problem. You have a keeping problem.</div>
  </foreignObject>
  <text x="80" y="520" fill="#1d1a14" font-family="Georgia, serif" font-size="28">1. The ideas leaked because nothing in the week asked you to use them</text>
  <text x="80" y="640" fill="#1d1a14" font-family="Georgia, serif" font-size="28">2. If you cannot say it, you did not keep it</text>
  <text x="80" y="760" fill="#1d1a14" font-family="Georgia, serif" font-size="28">3. Remember this: the book is not finished when you close it</text>
  <text x="80" y="880" fill="#1d1a14" font-family="Georgia, serif" font-size="28">4. Rather than paint the page yellow, write the idea in your own words</text>
  <text x="80" y="1000" fill="#1d1a14" font-family="Georgia, serif" font-size="28">5. If you cannot write it, you do not own it yet</text>
  <text x="80" y="1320" fill="#5c564a" font-family="Georgia, serif" font-size="22">The Commonplace Book — A. Reader</text>
  <text x="80" y="1380" fill="#274234" font-family="Georgia, serif" font-size="26">Don't just read. Build ideas.</text>
  <text x="80" y="1424" fill="#1d1a14" font-family="Georgia, serif" font-size="22">https://albuc.com</text>
</svg>
